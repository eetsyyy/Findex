[project]
name = "findex"
version = "0.6.0"
description = "Findex: typed and tested text search CLI (Python course labs 01–06)"
readme = "README.md"
requires-python = ">=3.11"
dependencies = ["typer>=0.12", "rich>=13", "httpx>=0.27"]

[project.scripts]
findex = "findex.cli:main"

[dependency-groups]
dev = ["pytest>=8", "ruff>=0.8", "pyright>=1.1.400", "hypothesis>=6", "pytest-cov>=5", "build>=1", "matplotlib>=3.8", "psutil>=5.9"]

[build-system]
requires = ["hatchling>=1.25"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/findex"]

[tool.pytest.ini_options]
testpaths = ["tests"]
markers = ["slow: tests taking more than one second"]

[tool.ruff]
line-length = 100
src = ["src", "tests", "scripts"]
extend-exclude = [".venv-nogil"]

[tool.pyright]
typeCheckingMode = "strict"
include = ["src/findex"]
